[package]
name = "scheduler-demo"
version = "0.1.0"
edition = "2021"
description = "教学版进程内任务调度器（Tokio + BinaryHeap 最小堆）"

[lib]
name = "scheduler_demo"
path = "src/lib.rs"

[[bin]]
name = "scheduler-demo"
path = "src/main.rs"

[dependencies]
# test-util: 提供 #[tokio::test(start_paused = true)] 的暂停时钟能力
tokio = { version = "1", features = ["full", "test-util"] }
async-trait = "0.1"
# 用于 FutureExt::catch_unwind（panic 隔离）
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
