<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Tab 切换栏 -->
    <nav class="tab-nav">
      <button id="tab-header" class="tab-btn active">请求头捕获</button>
      <button id="tab-bookmark" class="tab-btn">书签管理</button>
      <button id="tab-summary" class="tab-btn">页面总结</button>
      <button id="tab-llm" class="tab-btn">LLM 配置</button>
    </nav>

    <!-- Tab 1: 请求头抓取 (原内容) -->
    <div id="panel-header" class="tab-panel active">
      <header class="header">
        <h1 class="title">Header Capture</h1>
        <span id="capture-count" class="badge">0</span>
      </header>
      <div class="toolbar">
        <button id="copy-all-btn" class="btn btn-primary" disabled>复制全部</button>
        <button id="clear-btn" class="btn btn-danger">清空</button>
      </div>
      <div id="capture-list" class="capture-list">
        <div id="empty-state" class="empty-state">
          <p>暂无捕获记录</p>
          <p class="hint">请确保 URL 匹配规则配置正确</p>
        </div>
      </div>
      <hr class="divider">
      <div class="settings-section">
        <button id="settings-toggle" class="btn-settings">&#x2699; 配置</button>
        <div id="settings-panel" class="settings-panel hidden">
          <label for="url-patterns-input">URL 匹配规则（每行一条，支持 * 通配符）</label>
          <textarea id="url-patterns-input" rows="3" placeholder="*.example.com/api/*"></textarea>
          <label for="header-fields-input">请求头字段（逗号分隔）</label>
          <input id="header-fields-input" type="text" placeholder="Authorization, Cookie, X-Token">
          <button id="save-btn" class="btn btn-primary full-width">保存配置</button>
        </div>
      </div>
    </div>

    <!-- Tab 2: 书签管理 -->
    <div id="panel-bookmark" class="tab-panel">
      <header class="header">
        <h1 class="title">书签管理</h1>
        <span id="bookmark-stat" class="badge">--</span>
      </header>
      <div class="bookmark-quick-stats" id="quick-stats">
        <div class="stat-item">
          <span class="stat-value" id="stat-total">--</span>
          <span class="stat-label">书签总数</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="stat-folders">--</span>
          <span class="stat-label">文件夹</span>
        </div>
      </div>
      <button id="open-sidepanel-btn" class="btn btn-primary full-width">打开书签管理</button>
    </div>

    <!-- Tab 3: 页面总结 -->
    <div id="panel-summary" class="tab-panel">
      <header class="header">
        <h1 class="title">页面总结</h1>
      </header>
      <div class="empty-state">
        <p>读取当前网页内容，生成中文总结</p>
        <p class="hint">支持简短 / 标准 / 详细三种档位</p>
      </div>
      <button id="open-summary-btn" class="btn btn-primary full-width">打开页面总结</button>
    </div>
    <!-- Tab 4: LLM 配置 -->
    <div id="panel-llm" class="tab-panel">
      <header class="header">
        <h1 class="title">LLM 配置</h1>
      </header>
      <div class="settings-panel">
        <label for="llm-endpoint">API Endpoint</label>
        <input id="llm-endpoint" type="text" placeholder="https://api.openai.com/v1/chat/completions">
        <label for="llm-apikey">API Key</label>
        <input id="llm-apikey" type="password" placeholder="sk-...">
        <label for="llm-model">Model</label>
        <input id="llm-model" type="text" placeholder="gpt-4o-mini">
        <button id="llm-save-btn" class="btn btn-primary full-width" style="margin-top:12px;">保存</button>
      </div>
    </div>
    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
